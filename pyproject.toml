[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.2"
description = "macOS resource governor — memory pressure, swap, disk monitoring and auto-reclaim"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "typer>=0.12",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.21",
    "hypothesis>=6",
    "ruff>=0.4",
    "docker>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly, not left to the tool's defaults. CI installs an unpinned
# ruff, and 0.16 widened the default rule set (I001, C408, PLR0402, PLC0415,
# ...), which turned a green tree red without a line of source changing. An
# explicit select makes the lint contract a property of this repo rather than
# of whichever ruff version happens to resolve. These four are the historical
# defaults the codebase was written against.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
